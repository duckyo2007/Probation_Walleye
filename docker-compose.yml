services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easyplan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/static/slides:/app/static/slides
    env_file:
      - ./backend/.env.example
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easyplan-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
